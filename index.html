<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3A4FB0"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Personal Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, bottom tab bar, cards on a quiet ground. Amounts in the display face; red/green only for owe/get. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --ink:#16232A; --muted:#5A6B72; --line:#DCE3E1;
  --accent:#0D7A78; --accent-ink:#FFFFFF; --accent-soft:#DAEFED;
  --bad:#B3261E; --bad-soft:#FBE5E3; --good:#1B7A2F; --good-soft:#E2F3E5; --warn-soft:#FFF1CC; --warn-ink:#6B4A00;
  --shadow:0 1px 2px rgba(20,35,40,.06),0 6px 18px rgba(20,35,40,.05);
  --disp:'Bricolage Grotesque','Figtree',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1719; --surface:#172226; --ink:#E7EEEC; --muted:#9BABA8; --line:#263539;
  --accent:#43BDBA; --accent-ink:#04211F; --accent-soft:#123B3C;
  --bad:#FF9A91; --bad-soft:#3B1D1B; --good:#7ED891; --good-soft:#15331C; --warn-soft:#3A3010; --warn-ink:#F2D58A;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1719; --surface:#172226; --ink:#E7EEEC; --muted:#9BABA8; --line:#263539;
  --accent:#43BDBA; --accent-ink:#04211F; --accent-soft:#123B3C;
  --bad:#FF9A91; --bad-soft:#3B1D1B; --good:#7ED891; --good-soft:#15331C; --warn-soft:#3A3010; --warn-ink:#F2D58A;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:18px 16px 110px}
h1{font:700 26px/1.1 var(--disp);margin:6px 0 4px;letter-spacing:-.01em}
h2{font:700 15px/1.2 var(--disp);margin:22px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
h3{font:600 13px var(--body);color:var(--muted);margin:16px 0 6px}
h4{font:700 13px var(--disp);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--muted);margin:0 0 12px}
.hint{color:var(--muted);font-size:13px;margin:8px 0}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.empty{padding:16px;color:var(--muted)}
.list .row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.list .row:last-child{border-bottom:0}
.row.link:active{background:var(--accent-soft)}
.grow{flex:1;min-width:0}
.t{overflow-wrap:anywhere}.s{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.amt{font:700 16px var(--disp);white-space:nowrap;font-variant-numeric:tabular-nums}
.amt2{font-size:14px;text-align:right}
.owe{color:var(--bad);font-weight:600}.get{color:var(--good);font-weight:600}.ok{color:var(--muted)}
.chev{color:var(--muted);font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stats span{display:block;font-size:11px;color:var(--muted)}.stats b{font:700 15px var(--disp);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mini{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.banner{display:block;width:100%;text-align:left;border:0;border-radius:12px;padding:11px 13px;margin:8px 0;font-size:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn-ink)}.banner.bad{background:var(--bad-soft);color:var(--bad)}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
/* forms */
.form{padding:14px;display:flex;flex-direction:column;gap:12px}
label small{font-weight:400}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two.ng{grid-template-columns:1fr 1fr;align-items:end}.two.ng .btn{grid-column:1/3}
label.chk{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.people{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.prow:last-child{border-bottom:0}
.pn{flex:1;font-weight:600;min-width:0}.pn small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.step{display:flex;align-items:center;gap:6px}
.step button,.rs{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;font-weight:600}
.rs{font-size:16px;width:34px;height:34px;color:var(--muted)}.rs.on{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.sv{min-width:62px;text-align:center;font:700 17px var(--disp)}.sv.dim{color:var(--muted)}.sv.off{color:var(--bad);font-size:13px}
.num{width:112px;text-align:right}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.chip small{color:var(--muted);font-weight:400;margin-left:6px}.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.chip.on small{color:var(--accent-ink);opacity:.8}
.chip.add{border-style:dashed;color:var(--accent)}
.more{background:none;border:0;text-align:left;color:var(--accent);font-weight:600;padding:2px 0}
.pv{margin-top:12px;padding:12px 14px}.pl{font-weight:600}.pc{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:14px}.pc small{color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btns.sticky{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 18px;font-weight:700;text-decoration:none;flex:1;min-width:120px}
.btn.big{padding:14px 18px;font-size:16px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}.btn.danger-t{color:var(--bad)}
.btn:disabled{opacity:.45}
.form .btn{flex:none;width:100%}
/* bills */
.bar{display:flex;gap:12px;align-items:center;margin:10px 0}.bar input,.bar select{flex:1}
.bill{display:block;width:100%;text-align:left;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.bill.done{opacity:.65}
.b1{display:flex;justify-content:space-between;gap:10px}.bw{font-weight:700;overflow-wrap:anywhere}.ba{font:700 16px var(--disp);font-variant-numeric:tabular-nums}
.b2{color:var(--muted);font-size:13px;margin-top:2px}.b3{color:var(--bad);font-size:13px;margin-top:3px}
.tag{position:absolute;right:12px;bottom:9px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
/* statement */
.ab{display:grid;grid-template-columns:1fr;gap:10px}
.blk{border-radius:14px;padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.blk.a h4{color:var(--bad)}.blk.b h4{color:var(--good)}
.ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.ln b{font-variant-numeric:tabular-nums}.ln.tot{border-bottom:0;font-weight:700;padding-top:8px}.ln.hid{display:none}
.res{margin-top:10px;border-radius:14px;padding:14px;text-align:center}
.res.pay{background:var(--bad-soft);color:var(--bad)}.res.get{background:var(--good-soft);color:var(--good)}.res.ok{background:var(--accent-soft);color:var(--accent)}
.res .two2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.res small{display:block;font-size:12px;opacity:.85}.res b{font:700 24px var(--disp);font-variant-numeric:tabular-nums}
.res p{margin:8px 0 0;font-weight:700;font-size:16px}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;font-size:13px;min-width:100%}th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}th{font-weight:700;color:var(--muted);font-size:12px}
tr.tt td{font-weight:700;border-bottom:0}
/* nav, toast, modal */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav .nv{flex:1;max-width:100px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:600;padding:4px 0}
nav .nv.on{color:var(--accent)}
nav .fab svg{background:var(--accent);border-radius:50%;padding:6px;width:36px;height:36px;margin-top:-14px;box-shadow:0 3px 10px rgba(13,122,120,.35)}
nav .fab{color:var(--accent)}nav .fab svg{color:var(--accent-ink)}
#toast[hidden]{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:9;max-width:92vw;font-weight:600;font-size:14px}
#toast button{background:none;border:0;color:var(--accent);font-weight:700;filter:brightness(1.4)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet textarea{font-size:13px}

.chipsync{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;margin:0 0 6px;max-width:100%;text-align:left}
.chipsync i,.stline i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.chipsync.ok i,.stline.ok i{background:var(--good)}.chipsync.wait i,.stline.wait i{background:#E0A100}.chipsync.bad i,.stline.bad i{background:var(--bad)}
.stline{display:flex;align-items:center;gap:8px}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.mini{transition:background .15s}}

/* ===== v8 look: hero header, avatars, pills, timeline statement, floating tab bar ===== */
:root{--grad:linear-gradient(135deg,#0B6E6C 0%,#14978E 55%,#38BFA3 100%);--hero-shadow:0 12px 28px rgba(13,122,120,.26)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--grad:linear-gradient(135deg,#0E3F42 0%,#126A68 60%,#1B8B80 100%);--hero-shadow:none}}
:root[data-theme="dark"]{--grad:linear-gradient(135deg,#0E3F42 0%,#126A68 60%,#1B8B80 100%);--hero-shadow:none}
body{background:var(--bg);background-image:radial-gradient(1200px 380px at 50% -140px,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%);background-repeat:no-repeat}
main{padding-bottom:130px}
h1{font-size:28px}
h2{margin:26px 0 9px;display:flex;align-items:center;gap:8px}
h2:after{content:"";flex:1;height:1px;background:var(--line)}
.card{border-radius:18px}
.hero{position:relative;overflow:hidden;background:var(--grad);color:#fff;border-radius:24px;padding:18px 16px 16px;margin:2px 0 8px;box-shadow:var(--hero-shadow)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.hero:before{width:190px;height:190px;right:-60px;top:-70px}.hero:after{width:120px;height:120px;left:-40px;bottom:-60px}
.hero>*{position:relative}
.hero h1{color:#fff;margin:3px 0 2px;font-size:26px}.hero small{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.82}
.hero .hsub{margin:0;opacity:.9;font-size:14px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hstats div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);border-radius:15px;padding:10px 10px 9px;min-width:0}
.hstats span{display:block;font-size:11px;opacity:.88}.hstats b{font:700 17px var(--disp);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero .chipsync{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.28);color:#fff;margin:12px 0 0}
.hero .chipsync i{box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.av{--h:180;display:inline-flex;align-items:center;justify-content:center;flex:none;width:38px;height:38px;border-radius:50%;background:hsl(var(--h) 62% 90%);color:hsl(var(--h) 58% 26%);font:700 16px var(--disp)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av{background:hsl(var(--h) 38% 24%);color:hsl(var(--h) 75% 84%)}}
:root[data-theme="dark"] .av{background:hsl(var(--h) 38% 24%);color:hsl(var(--h) 75% 84%)}
.av.lg{width:48px;height:48px;font-size:20px;background:rgba(255,255,255,.22)!important;color:#fff!important;border:1px solid rgba(255,255,255,.35)}
.av.sm{width:30px;height:30px;font-size:13px}
.pair{display:flex;align-items:center;gap:2px;flex:none}.pair i{font-style:normal;color:var(--muted);font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.owe{background:var(--bad-soft);color:var(--bad)}.pill.get{background:var(--good-soft);color:var(--good)}.pill.ok{background:var(--accent-soft);color:var(--accent)}
.trip{display:inline-block;margin-left:6px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:1px 8px;font-size:11.5px;font-weight:700;vertical-align:1px}
.b2 .trip{margin-left:0}
.list .row{padding:12px 14px}
.row.link:active{background:var(--accent-soft)}
.mini{background:var(--accent-soft);border-color:transparent}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 7px;color:var(--ink)}
.mh span{font:700 15px var(--disp)}.mh b{font:600 13px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.bill{display:flex;gap:11px;align-items:flex-start;border-radius:16px;box-shadow:var(--shadow);padding:12px 13px}
.bill .bm{flex:1;min-width:0}.bill:active{transform:scale(.99)}
.tico{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);align-items:center;justify-content:center;flex:none}
.tico svg{width:18px;height:18px}
.sfilter{gap:10px}.who{display:flex;align-items:center;gap:10px}.who select{font-weight:700}
.pchips .chip{padding:6px 11px;font-size:13px}
.res{border-radius:20px;padding:16px 14px;margin-top:12px}
.res>small{display:block;margin-bottom:6px;font-weight:600}
.res b{font-size:26px}
.ab{gap:12px}.blk{border-radius:18px;box-shadow:var(--shadow);padding:13px 15px}
.blk.a{border-top:3px solid var(--bad)}.blk.b{border-top:3px solid var(--good)}
.led{overflow:hidden}
.lr{display:grid;grid-template-columns:44px 1fr auto;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.lr:last-child{border-bottom:0}
.lr.pay{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.lr.open,.lr.close{background:var(--accent-soft)}
.ld{text-align:center;line-height:1.05;padding-top:1px}.ld b{display:block;font:700 19px var(--disp);font-variant-numeric:tabular-nums}.ld span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.lm{min-width:0}.lm .t{line-height:1.25}.lx{text-align:right;font-size:13px;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.lx b{font-variant-numeric:tabular-nums}
.lx .bal{font-size:11.5px;font-weight:600;margin-top:3px;padding-top:3px;border-top:1px dashed var(--line)}
.bal.owe{color:var(--bad)}.bal.get{color:var(--good)}.bal.ok{color:var(--muted)}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;border:1px solid var(--line);border-radius:26px;padding:6px 8px;box-shadow:0 10px 30px rgba(15,30,35,.16);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
nav .nv{border-radius:18px;position:relative;transition:color .15s}
nav .nv.on:not(.fab){color:var(--accent);background:var(--accent-soft)}
nav .fab svg{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(13,122,120,.4);width:40px;height:40px;margin-top:-18px;padding:8px}
.btns.sticky{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
#toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.btn{border-radius:14px;background:var(--grad);transition:transform .1s}.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface)}.btn.danger{background:var(--bad)}
.seg button.on{background:var(--grad)}
.chip.on{background:var(--grad);border-color:transparent}
.tchips{margin-top:-4px}
.empty{text-align:center;padding:20px 16px}
@media (prefers-reduced-motion:no-preference){main>*{animation:rise .28s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
.row.plan{flex-wrap:wrap;row-gap:4px}.row.plan .pd{flex-basis:100%;padding-left:2px;line-height:1.35}

/* ===== v9: guest receivables caption, trip lock, brought-forward strip ===== */
.hstats em{display:block;font:500 10px var(--body, inherit);font-style:normal;opacity:.85;margin-top:2px}
.sfilter.locked .chip[disabled],.sfilter.locked input[disabled]{opacity:.45;pointer-events:none}
.lockhint{margin:2px 2px 8px}
.res .bc{display:flex;justify-content:space-between;gap:10px;margin-top:10px;padding-top:9px;border-top:1px dashed rgba(0,0,0,.16);font-size:11px;flex-wrap:wrap}
.res .bc b{display:block;font-size:13px;margin-top:1px}
.hint.tl{text-align:right;margin:4px 8px 0}
.ab.one{grid-template-columns:1fr}

/* ===== Personal Ledger: own colours + report tables ===== */
:root{--accent:#3A4FB0;--accent-soft:#E3E8FA;--grad:linear-gradient(135deg,#27368A 0%,#3C53BF 55%,#6C84E6 100%);--hero-shadow:0 12px 28px rgba(58,79,176,.28)}

<script>
/* ===== LEDGER ENGINE: double entry, cash basis, two partners + both =====
   S = { set:{p1,p2,start,joint (percent of a Joint item that belongs to p1), openDue (p2 owes p1 at start), expect:{gf1,gf2,gr1,gr2}, groupId},
         accounts:[{name,cat,sub,owner,open,actual}], journal:[{id,date,narr,dr,cr,amt,for,note}], feed:[{date,narr,dr,cr,amt,for,ref}] }  */
const CATS = ['Income', 'Expense', 'Current Asset', 'Non-current Asset', 'Current Liability', 'Non-current Liability'];
const isBSCat = c => /Asset|Liability/.test(c);
const isAssetCat = c => /Asset/.test(c);
const SYSN = { '@GF1': 1, '@GR1': 1, '@GF2': 0, '@GR2': 0, '@OBE': -1 };
const nz = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const rr = x => { const s = x < 0 ? -1 : 1; return s * Math.round(Math.abs(x) * 100 + 1e-7) / 100; };

function ledger(S, opt) {
  opt = opt || {};
  const set = S.set, j = nz(set.joint) / 100;
  const own = o => o === set.p1 ? 1 : o === set.p2 ? 0 : j;      // fraction that belongs to partner 1
  const seen = {};
  const A = S.accounts.filter(a => a.name).map((a, i) => {
    const o = { name: String(a.name).trim(), cat: a.cat, sub: a.sub || '', owner: a.owner || '', open: nz(a.open), actual: (a.actual === '' || a.actual == null) ? null : nz(a.actual), i };
    o.ok = CATS.indexOf(o.cat) >= 0; o.bs = o.ok && isBSCat(o.cat); o.asset = o.ok && isAssetCat(o.cat);
    o.f = o.bs ? own(o.owner) : null;
    o.ownerOk = !o.bs || o.owner === set.p1 || o.owner === set.p2 || o.owner === 'Joint';
    const k = o.name.toLowerCase();
    o.dup = !!seen[k]; seen[k] = 1;
    return o;
  });
  const byName = {};
  A.forEach(a => { if (!a.dup) byName[a.name.toLowerCase()] = a; });
  const sysOf = c => (c in SYSN) ? { name: c, sys: true, f: SYSN[c], bs: true } : null;
  const find = n => sysOf(n) || byName[String(n || '').trim().toLowerCase()] || null;

  // ----- build the lines -----
  const L = [];   // {src,row,date,dr,cr,amt,for,valid,msg,fN,fS...}
  const add = (src, row, r) => {
    const l = { src, row, date: r.date || '', narr: r.narr || '', dr: r.dr || '', cr: r.cr || '', amt: nz(r.amt), for: r.for || '', note: r.note || '', ref: r.ref || r.id || '', id: r.id };
    const blank = !l.date && !l.narr && !l.dr && !l.cr && !r.amt && !l.for;
    if (blank) return;
    let m = '';
    const a = find(l.dr), b = find(l.cr);
    if (!l.date) m = 'Enter the date';
    else if (l.date < set.start && src !== 'O') m = 'Date is before the books start date (' + set.start + ')';
    else if (!l.dr) m = 'Choose the debit account';
    else if (!a || (a.sys && src === 'J')) m = 'Debit account not found: ' + l.dr;
    else if (!l.cr) m = 'Choose the credit account';
    else if (!b || (b.sys && src === 'J')) m = 'Credit account not found: ' + l.cr;
    else if (l.dr.toLowerCase() === l.cr.toLowerCase()) m = 'Debit and credit are the same account';
    else if (!(l.amt > 0)) m = 'Amount must be more than 0';
    else if (a.dup || b.dup) m = 'Two accounts have this name';
    else if ((a.ok === false) || (b.ok === false)) m = 'An account has no valid category';
    l.valid = !m; l.msg = m;
    if (l.valid) {
      // fractions
      const forF = () => {
        if (l.for === set.p1) return 1; if (l.for === set.p2) return 0; if (l.for === 'Joint') return j;
        // blank: owner of the balance-sheet side
        const s1 = a.bs ? a : b.bs ? b : null;
        return s1 && s1.f !== undefined && s1.f !== -1 ? s1.f : j;
      };
      const ff = forF();
      let fd = a.bs ? a.f : ff, fc = b.bs ? b.f : ff;
      if (fd === -1) fd = fc; if (fc === -1) fc = fd;
      l.fd = fd; l.fc = fc;
    }
    L.push(l);
  };
  S.journal.forEach((r, i) => add('J', i, r));
  (S.feed || []).forEach((r, i) => add('G', i, r));
  // opening lines of the accounts
  A.forEach(a => {
    if (!a.bs || !a.open || a.dup || !a.ok) return;
    const bal = a.asset ? a.open : -a.open;
    add('O', a.i, bal >= 0 ? { date: set.start, dr: a.name, cr: '@OBE', amt: bal } : { date: set.start, dr: '@OBE', cr: a.name, amt: -bal });
  });

  const asat = opt.asat || '9999-12-31', from = opt.from || '0000-01-01', to = opt.to || '9999-12-31';
  // ----- balances -----
  const DB = {}, DBp = {};      // Dr balance per account: [N,S] as at; and for the period
  const get = (o, k) => o[k] || (o[k] = [0, 0]);
  let dueN = nz(set.openDue), dueAll = 0;
  L.forEach(l => {
    if (!l.valid) return;
    const dN = l.amt * l.fd, cN = l.amt * l.fc, dS = l.amt - dN, cS = l.amt - cN;
    if (l.date <= asat) {
      const x = get(DB, l.dr), y = get(DB, l.cr);
      x[0] += dN; x[1] += dS; y[0] -= cN; y[1] -= cS;
      dueN += l.amt * (l.fc - l.fd);
    }
    if (l.date >= from && l.date <= to) {
      const x = get(DBp, l.dr), y = get(DBp, l.cr);
      x[0] += dN; x[1] += dS; y[0] -= cN; y[1] -= cS;
    }
  });
  const z = [0, 0];
  const bal = k => DB[k] || z, balp = k => DBp[k] || z;
  const tri = (n, s) => ({ n, s, b: n + s });
  // ----- accounts view -----
  const accounts = A.map(a => {
    const d = bal(a.name);
    const sign = a.bs ? (a.asset ? 1 : -1) : 1;
    const tot = (d[0] + d[1]) * sign;
    const o = { name: a.name, cat: a.cat, sub: a.sub, owner: a.owner, open: a.open, actual: a.actual, balance: a.bs ? rr(tot) : null };
    if (a.bs && a.actual !== null) o.diff = rr(a.actual - tot);
    return o;
  });
  // ----- income & expenditure -----
  const ie = { income: [], expense: [] };
  A.forEach(a => {
    if (a.bs || !a.ok || a.dup) return;
    const d = balp(a.name), sg = a.cat === 'Income' ? -1 : 1;
    const v = tri(d[0] * sg, d[1] * sg);
    if (Math.abs(v.n) < 0.005 && Math.abs(v.s) < 0.005) return;
    (a.cat === 'Income' ? ie.income : ie.expense).push({ name: a.name, sub: a.sub, n: v.n, s: v.s, b: v.b });
  });
  const sum = (rows, k) => rows.reduce((s, r) => s + r[k], 0);
  ie.totInc = tri(sum(ie.income, 'n'), sum(ie.income, 's')); ie.totInc.b = ie.totInc.n + ie.totInc.s;
  ie.totExp = tri(sum(ie.expense, 'n'), sum(ie.expense, 's')); ie.totExp.b = ie.totExp.n + ie.totExp.s;
  ie.surplus = tri(ie.totInc.n - ie.totExp.n, ie.totInc.s - ie.totExp.s);
  // ----- balance sheet -----
  const bs = { cur: [], non: [], curL: [], nonL: [] };
  const res = [0, 0];   // income less expenses since the start, up to the as-at date
  A.forEach(a => { if (a.bs || !a.ok || a.dup) return; const d = bal(a.name); res[0] += -d[0]; res[1] += -d[1]; });
  A.forEach(a => {
    if (!a.bs || a.dup) return;
    const d = bal(a.name), sg = a.asset ? 1 : -1;
    const v = tri(d[0] * sg, d[1] * sg);
    if (Math.abs(v.n) < 0.005 && Math.abs(v.s) < 0.005 && !a.open) return;
    const row = { name: a.name, sub: a.sub, n: v.n, s: v.s, b: v.b };
    (a.cat === 'Current Asset' ? bs.cur : a.cat === 'Non-current Asset' ? bs.non : a.cat === 'Current Liability' ? bs.curL : bs.nonL).push(row);
  });
  // system lines (sign-split per column)
  const split = (n, s, elim) => ({ aN: Math.max(n, 0), aS: Math.max(s, 0), lN: Math.max(-n, 0), lS: Math.max(-s, 0), elim });
  const gf = [bal('@GF1')[0] + bal('@GF1')[1], bal('@GF2')[0] + bal('@GF2')[1]];
  const gr = [bal('@GR1')[0] + bal('@GR1')[1], bal('@GR2')[0] + bal('@GR2')[1]];
  const dueS = -dueN;
  const sys = {
    gf: split(gf[0], gf[1], false), gr: split(gr[0], gr[1], false), due: split(dueN, dueS, true),
    raw: { gf, gr, dueN }
  };
  const sa = k => ({ n: sys[k].aN, s: sys[k].aS, b: sys[k].elim ? 0 : sys[k].aN + sys[k].aS });
  const sl = k => ({ n: sys[k].lN, s: sys[k].lS, b: sys[k].elim ? 0 : sys[k].lN + sys[k].lS });
  bs.sysA = { gr: sa('gr'), gf: sa('gf'), due: sa('due') };
  bs.sysL = { gr: sl('gr'), gf: sl('gf'), due: sl('due') };
  const obe = [-(bal('@OBE')[0]) + nz(set.openDue), -(bal('@OBE')[1]) - nz(set.openDue)];
  const addAll = (rows, extra) => ({ n: sum(rows, 'n') + extra.reduce((s, e) => s + e.n, 0), s: sum(rows, 's') + extra.reduce((s, e) => s + e.s, 0), b: sum(rows, 'b') + extra.reduce((s, e) => s + e.b, 0) });
  bs.totCur = addAll(bs.cur, [bs.sysA.gr, bs.sysA.gf, bs.sysA.due]);
  bs.totNon = addAll(bs.non, []);
  bs.totA = tri(bs.totCur.n + bs.totNon.n, bs.totCur.s + bs.totNon.s); bs.totA.b = bs.totCur.b + bs.totNon.b;
  bs.totCurL = addAll(bs.curL, [bs.sysL.gr, bs.sysL.gf, bs.sysL.due]);
  bs.totNonL = addAll(bs.nonL, []);
  bs.totL = tri(bs.totCurL.n + bs.totNonL.n, bs.totCurL.s + bs.totNonL.s); bs.totL.b = bs.totCurL.b + bs.totNonL.b;
  bs.netAssets = tri(bs.totA.n - bs.totL.n, bs.totA.s - bs.totL.s); bs.netAssets.b = bs.totA.b - bs.totL.b;
  bs.obe = { n: obe[0], s: obe[1], b: obe[0] + obe[1] };
  bs.result = { n: res[0], s: res[1], b: res[0] + res[1] };
  bs.equity = { n: bs.obe.n + bs.result.n, s: bs.obe.s + bs.result.s, b: bs.obe.b + bs.result.b };
  bs.check = { n: bs.netAssets.n - bs.equity.n, s: bs.netAssets.s - bs.equity.s, b: bs.netAssets.b - bs.equity.b };

  // ----- alerts -----
  const alerts = [];
  const bad = L.filter(l => !l.valid && l.src === 'J');
  if (bad.length) alerts.push({ lv: 'bad', t: bad.length + ' journal ' + (bad.length === 1 ? 'entry is' : 'entries are') + ' NOT counted in the reports', rows: bad.slice(0, 8).map(l => 'Journal row ' + (l.row + 1) + ': ' + l.msg) });
  const badG = L.filter(l => !l.valid && l.src === 'G');
  if (badG.length) alerts.push({ lv: 'bad', t: badG.length + ' group line(s) cannot be posted - check the Group Map / Settings accounts', rows: badG.slice(0, 5).map(l => l.narr + ': ' + l.msg) });
  A.forEach(a => {
    if (a.dup) alerts.push({ lv: 'bad', t: 'Account name used twice: ' + a.name });
    else if (!a.ok) alerts.push({ lv: 'bad', t: 'Account "' + a.name + '" has no valid category' });
    else if (!a.ownerOk) alerts.push({ lv: 'warn', t: 'Account "' + a.name + '" has no owner (' + set.p1 + ' / ' + set.p2 + ' / Joint) - treated as Joint' });
  });
  accounts.forEach(a => {
    if (a.diff !== undefined && Math.abs(a.diff) >= 0.005) alerts.push({ lv: 'bad', t: a.name + ': the books say ' + fmt(a.balance) + ' but you entered the real balance ' + fmt(a.actual) + ' (difference ' + fmt(a.diff) + ')', acct: a.name });
  });
  const aMap = {}; A.forEach(a => { aMap[a.name] = a; });
  accounts.forEach(a => {
    if (a.balance === null || a.balance === undefined) return;
    if (a.balance < -0.004) alerts.push({ lv: 'warn', t: a.name + ' is negative (' + fmt(a.balance) + ') - check the entries', acct: a.name });
  });
  if (L.some(l => l.src === 'G')) {
    const ex = set.expect || {};
    [['gf1', gf[0], set.p1 + ' net with group friends'], ['gf2', gf[1], set.p2 + ' net with group friends'], ['gr1', gr[0], set.p1 + ' guests owe'], ['gr2', gr[1], set.p2 + ' guests owe']].forEach(t => {
      if (ex[t[0]] === undefined || ex[t[0]] === '' || ex[t[0]] === null) return;
      if (asat === '9999-12-31' || true) {
        // compare all-time ledger totals (feed lines are all dated <= today in normal use)
        const all = allTime(t[0]);
        if (Math.abs(all - nz(ex[t[0]])) > 0.06) alerts.push({ lv: 'warn', t: 'Group link: ' + t[2] + ' is ' + fmt(all) + ' in the ledger but ' + fmt(nz(ex[t[0]])) + ' in the group sheet - refresh the group data' });
      }
    });
  }
  function allTime(k) {
    const acct = '@' + k.slice(0, 2).toUpperCase() + k[2];
    let v = 0; L.forEach(l => { if (!l.valid) return; if (l.dr === acct) v += l.amt * (acct.endsWith('1') ? l.fd : (1 - l.fd)); if (l.cr === acct) v -= l.amt * (acct.endsWith('1') ? l.fc : (1 - l.fc)); });
    return v;
  }
  if (Math.abs(dueN) >= 0.005) alerts.push({ lv: 'info', t: dueN > 0 ? set.p2 + ' owes ' + set.p1 + ' ' + fmt(dueN) + ' (shared items paid from ' + set.p1 + '\'s accounts)' : set.p1 + ' owes ' + set.p2 + ' ' + fmt(-dueN) + ' (shared items paid from ' + set.p2 + '\'s accounts)' });
  if (Math.abs(bs.check.b) > 0.005 || Math.abs(bs.check.n) > 0.005 || Math.abs(bs.check.s) > 0.005) alerts.push({ lv: 'bad', t: 'Balance sheet does not balance by ' + fmt(bs.check.b) + ' - please tell me, this should never happen' });
  // opening position
  let oA = 0, oL = 0; A.forEach(a => { if (a.bs && !a.dup) { if (a.asset) oA += a.open; else oL += a.open; } });
  const opening = { assets: oA, liabilities: oL, net: oA - oL };
  if (opening.net < -0.004) alerts.push({ lv: 'warn', t: 'At the start your liabilities (' + fmt(oL) + ') are more than your assets (' + fmt(oA) + '): net worth ' + fmt(opening.net) });
  // dashboard numbers
  const topExp = ie.expense.slice().sort((x, y) => y.b - x.b).slice(0, 5);
  return { accounts, ie, bs, alerts, lines: L, opening, topExp, due: dueN, nLines: L.filter(l => l.valid).length, sys: sys.raw };
}
function fmt(n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

</script>
<script>
/* ===== PERSONAL LEDGER APP ===== */
const KEY = 'gxl.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const dshow = s => s ? (s.slice(8, 10) + ' ' + MON[+s.slice(5, 7) - 1] + ' ' + s.slice(2, 4)) : 'no date';
const cleanN = s => String(s == null ? '' : s).trim().toLowerCase();
const money = n => { const v = Math.abs(n) < 0.005 ? 0 : n; return Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
const dash = n => Math.abs(n) < 0.005 ? '–' : money(n);

/* ---------- storage ---------- */
let S = null, storageOK = true;
let SY = { url: '', token: '', lastSync: 0, lastError: '' }, OB = [], syncing = false;
const syncOn = () => !!(SY.url && SY.token);
function loadSY() { try { const x = JSON.parse(localStorage.getItem('gxl.sync') || 'null'); if (x) SY = Object.assign(SY, x); const o = JSON.parse(localStorage.getItem('gxl.outbox') || '[]'); if (Array.isArray(o)) OB = o; } catch (e) { } }
function saveSY() { try { localStorage.setItem('gxl.sync', JSON.stringify(SY)); } catch (e) { } }
function saveOB() { try { localStorage.setItem('gxl.outbox', JSON.stringify(OB)); } catch (e) { } }
function emptyState() { return { v: 1, set: { p1: '', p2: '', start: '', joint: 50, openDue: 0, cur: 'AED', gid: '', exp1: '', exp2: '', cash1: '', cash2: '', refreshed: '', expect: {}, read: '' }, accounts: [], journal: [], feed: [], map: [], meta: { changes: 0 }, prefs: {} }; }
function load() {
  try { const t = localStorage.getItem(KEY); if (t) { const x = JSON.parse(t); if (x && x.set) return x; } } catch (e) { storageOK = false; }
  return emptyState();
}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; } }
function commit() { S.meta.changes = (S.meta.changes || 0) + 1; persist(); }

/* ---------- ui state ---------- */
const UI = { view: 'home', who: 'B', per: 'month', from: '', to: '', rtab: 'ie', jf: 'all', jq: '', acct: '', toast: null, modal: null, confirm: null, shown: 60, aq: '' };
let F = null, R = null, NA = null;
function periodOf() {
  const t = today(), y = +t.slice(0, 4), m = +t.slice(5, 7);
  const lastDay = (yy, mm) => ymd(new Date(yy, mm, 0));
  switch (UI.per) {
    case 'last': { const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1; return { from: py + '-' + pad(pm) + '-01', to: lastDay(py, pm), label: MON[pm - 1] + ' ' + py }; }
    case 'year': return { from: y + '-01-01', to: t, label: 'This year' };
    case 'lastyear': return { from: (y - 1) + '-01-01', to: (y - 1) + '-12-31', label: String(y - 1) };
    case 'all': return { from: S.set.start || '1900-01-01', to: t, label: 'Since the start' };
    case 'custom': return { from: UI.from || t, to: UI.to || t, label: 'Custom' };

  if (UI.modal) modal = '<div class="modal"><div class="sheet"><h3>' + esc(UI.modal.title) + '</h3><textarea id="modalText" rows="8" readonly>' + esc(UI.modal.text) + '</textarea><div class="btns"><button class="btn" data-act="copyModal">Copy</button><button class="btn ghost" data-act="closeModal">Close</button></div></div></div>';
  $('#app').innerHTML = '<main>' + (!storageOK ? '<div class="banner bad">This browser is not saving data on this phone.</div>' : '') + body + '</main><nav>' + nav + '</nav>' + modal;
  renderToast();
  if (UI.view === 'add') updatePreview();
}

/* ---------- events ---------- */
function nav(v) { if (v === 'add' && (!F || F.id)) F = newForm(); go(v); }
function setBind(key, el) {
  const v = el.value;
  if (key === 'jq') { UI.jq = v; const l = $('#jlist'); if (l) l.innerHTML = journalListHtml(); return; }
  if (key === 'aq') { UI.aq = v; render(); const i = document.querySelector('[data-bind=aq]'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } return; }
  if (key === 'from' || key === 'to') { UI[key] = v; render(); return; }
  const [ns, k] = key.split(':');
  if (ns === 'f') {
    F[k] = v;
    if (k === 'a1' || k === 'a2') { if (F.forAuto) { } updatePreview(); return; }
    updatePreview();
  } else if (ns === 'n') { NA[k] = v; if (k === 'cat') render(); }
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, arg = b.dataset.arg;
  switch (act) {
    case 'nav': nav(arg); break;
    case 'go': go(arg); break;
    case 'undo': doUndo(); break;
    case 'who': UI.who = arg; render(); break;
    case 'per': UI.per = arg; if (arg === 'custom' && !UI.from) { const p = periodOf(); UI.from = p.from; UI.to = p.to; } render(); break;
    case 'rtab': UI.rtab = arg; render(); break;
    case 'jf': UI.jf = arg; UI.shown = 60; render(); break;
    case 'more50': UI.shown += 60; render(); break;
    case 'tpl': { const keep = { date: F.date, narr: F.narr, amt: F.amt, note: F.note, id: F.id }; F = newForm(arg, keep); render(); break; }
    case 'forW': F.forAuto = false; F.forW = arg; updatePreview(); break;
    case 'saveEntry': saveEntry(); break;
    case 'cancelEntry': F = null; go('journal'); break;
    case 'askDel': UI.confirm = arg; render(); break;
    case 'delEntry': { const j = S.journal.find(x => x.id === F.id); undoOps = { before: JSON.parse(JSON.stringify(j)), id: F.id }; S.journal = S.journal.filter(x => x.id !== F.id); qOp({ op: 'deleteEntry', id: F.id }); F = null; UI.confirm = null; commit(); toast('Entry deleted', true); go('journal'); break; }
    case 'editEntry': {
      const j = S.journal.find(x => x.id === arg); if (!j) break;
      F = { id: j.id, tpl: 'cus', date: j.date, narr: j.narr || '', amt: String(j.amt === '' ? '' : j.amt), a1: j.dr, a2: j.cr, forW: j.for || '', forAuto: !j.for, note: j.note || '' };
      go('add'); break;
    }
    case 'acct': UI.acct = arg; go('acct'); break;
    case 'newAcct': NA = { isNew: true, name: '', cat: 'Expense', sub: '', owner: '', open: '' }; go('acctForm'); break;
    case 'editAcct': { const a = accOf(arg); NA = { isNew: false, name: a.name, cat: a.cat, sub: a.sub || '', owner: a.owner || '', open: a.open === '' || a.open == null ? '' : String(a.open) }; go('acctForm'); break; }
    case 'nOwner': NA.owner = arg; render(); break;
    case 'saveAcct': saveAcct(); break;
    case 'saveActual': {
      const a = accOf(UI.acct), t = ($('#act_real').value || '').trim().replace(',', '.');
      const v = t === '' ? '' : Number(t); if (t !== '' && !isFinite(v)) { toast('Enter a number'); break; }
      applyOp(S, { op: 'setActual', data: { name: a.name, actual: v } }); qOp({ op: 'setActual', data: { name: a.name, actual: v } }); commit(); toast(savedMsg('Saved')); render(); break;
    }
    case 'refreshGroup': qOp({ op: 'refreshGroup', data: {} }); toast('Refreshing group data…'); syncNow(true); break;
    case 'saveGroupSet': {
      const d = { exp1: $('#g_exp1').value, exp2: $('#g_exp2').value, cash1: $('#g_cash1').value, cash2: $('#g_cash2').value };
      applyOp(S, { op: 'setSettings', data: d }); qOp({ op: 'setSettings', data: d }); commit(); toast(savedMsg('Saved')); render(); break;
    }
    case 'saveSettings': {
      const d = { start: $('#st_start').value, joint: Number(String($('#st_joint').value).replace(',', '.')), openDue: Number(String($('#st_due').value).replace(',', '.')) || 0 };
      if (!d.start || !isFinite(d.joint) || d.joint < 0 || d.joint > 100) { toast('Check the date and a % between 0 and 100'); break; }
      applyOp(S, { op: 'setSettings', data: d }); qOp({ op: 'setSettings', data: d }); commit(); toast(savedMsg('Saved')); render(); break;
    }
    case 'copyCsv': UI.modal = { title: 'Entries (CSV)', text: csvOf() }; render(); break;
    case 'copyModal': { const a = $('#modalText'); a.select(); try { document.execCommand('copy'); toast('Copied'); } catch (e) { } break; }
    case 'closeModal': UI.modal = null; render(); break;
    case 'syncNow': syncNow(true); break;
    case 'connect': {
      const u = ($('#sy_url').value || '').trim(), t = ($('#sy_token').value || '').trim(), m = $('#syMsg');
      if (!/^(https:\/\/|http:\/\/localhost)/.test(u) || !t) { m.innerHTML = '<div class="banner bad">Enter the web app URL (starts with https://) and your secret.</div>'; break; }
      m.innerHTML = '<div class="banner warn">Connecting…</div>';
      const keep = Object.assign({}, SY); SY.url = u; SY.token = t;
      callSheet([]).then(j => {
        const st = j.state; S.set = st.set; S.accounts = st.accounts; S.journal = st.journal; S.feed = st.feed; S.map = st.map; OB = [];
        SY.lastSync = Date.now(); SY.lastError = ''; saveSY(); saveOB(); persist(); toast('Connected. ' + S.journal.length + ' entries loaded.'); go('home');
      }).catch(e => { SY = keep; m.innerHTML = '<div class="banner bad">' + esc(e.server ? e.message : 'Could not reach the script. Check the URL and your internet.') + '</div>'; });
      break;
    }
    case 'disconnect': SY = { url: '', token: '', lastSync: 0, lastError: '' }; OB = []; saveSY(); saveOB(); UI.confirm = null; toast('Disconnected. Data stays on this phone.'); render(); break;
  }
});
document.addEventListener('input', ev => { const el = ev.target; if (el.dataset && el.dataset.bind && el.tagName !== 'SELECT') setBind(el.dataset.bind, el); });
document.addEventListener('change', ev => {
  const el = ev.target; if (!el.dataset) return;
  if (el.dataset.bind && el.tagName === 'SELECT') setBind(el.dataset.bind, el);
  if (el.dataset.chg) {
    const [ns, i, k] = el.dataset.chg.split(':');
    if (ns === 'map') { const m = S.map[+i]; m[k] = el.value; const d = { trip: m.trip, a1: m.a1, a2: m.a2 }; qOp({ op: 'setMap', data: d }); commit(); toast(savedMsg('Saved')); }
  }
});

/* ---------- boot ---------- */
loadSY();
S = load();
S.prefs = S.prefs || {}; S.meta = S.meta || { changes: 0 };
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
persist();
render();
try { if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { }
window.addEventListener('online', () => syncNow(false));
window.addEventListener('offline', renderStatus);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(false); });
setInterval(() => { if (document.visibilityState === 'visible') syncNow(false); renderStatus(); }, 60000);
setTimeout(() => syncNow(false), 800);

</script></body></html>
